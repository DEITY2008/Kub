name: Build Thepkub APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate project and build APK
        run: |
          set -e
          mkdir -p app/src/main/java/com/thepkub/app app/src/main/res/drawable app/src/main/assets
          cat > settings.gradle <<'THEPKUB_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Thepkub'
          include ':app'
          THEPKUB_EOF
          cat > build.gradle <<'THEPKUB_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          THEPKUB_EOF
          cat > gradle.properties <<'THEPKUB_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          THEPKUB_EOF
          cat > app/build.gradle <<'THEPKUB_EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.thepkub.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.thepkub.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          THEPKUB_EOF
          cat > app/src/main/AndroidManifest.xml <<'THEPKUB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <application
                  android:label="Thepkub"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          THEPKUB_EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'THEPKUB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#05070B" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#D9B46A" android:pathData="M54,54m-34,0a34,34 0,1 1,68 0a34,34 0,1 1,-68 0"/>
              <path android:fillColor="#05070B" android:pathData="M54,54m-27,0a27,27 0,1 1,54 0a27,27 0,1 1,-54 0"/>
              <path android:fillColor="#D9B46A" android:pathData="M38,40h32v7h-12.5v24h-7v-24h-12.5z"/>
          </vector>
          THEPKUB_EOF
          cat > app/src/main/java/com/thepkub/app/MainActivity.java <<'THEPKUB_EOF'
          package com.thepkub.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkRequest;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JsResult;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              private WebView web;
              private ConnectivityManager cm;
              private ConnectivityManager.NetworkCallback cb;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  bindWifi();

                  web = new WebView(this);
                  web.setBackgroundColor(0xFF05070B);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onJsConfirm(WebView v, String url, String msg, final JsResult r) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(msg)
                              .setPositiveButton("OK", (d, w) -> r.confirm())
                              .setNegativeButton("Cancel", (d, w) -> r.cancel())
                              .setOnCancelListener(d -> r.cancel())
                              .show();
                          return true;
                      }
                  });
                  setContentView(web);
                  // ใช้ origin เดียวกับบอร์ด (http://192.168.4.1) เพื่อให้ fetch('/d?..') ทำงานเหมือนเปิดจากบอร์ด
                  web.loadDataWithBaseURL("http://192.168.4.1/", readAsset("index.html"),
                          "text/html", "utf-8", null);
              }

              // บังคับให้ทราฟฟิกของแอปใช้ Wi-Fi Thepkub แม้ไม่มีอินเทอร์เน็ต (กัน Android สลับไปใช้เน็ตมือถือ)
              private void bindWifi() {
                  try {
                      cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                      NetworkRequest req = new NetworkRequest.Builder()
                              .addTransportType(NetworkCapabilities.TRANSPORT_WIFI).build();
                      cb = new ConnectivityManager.NetworkCallback() {
                          @Override public void onAvailable(Network n) { cm.bindProcessToNetwork(n); }
                          @Override public void onLost(Network n) { cm.bindProcessToNetwork(null); }
                      };
                      cm.requestNetwork(req, cb);
                  } catch (Exception ignored) { }
              }

              private String readAsset(String name) {
                  try (InputStream in = getAssets().open(name)) {
                      ByteArrayOutputStream o = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192]; int n;
                      while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
                      return o.toString("UTF-8");
                  } catch (Exception e) { return "<h1>asset error</h1>"; }
              }

              @Override
              public void onWindowFocusChanged(boolean f) {
                  super.onWindowFocusChanged(f);
                  if (f) getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              @Override public void onBackPressed() { /* กันเผลอกดออกขณะขับ */ }

              @Override
              protected void onDestroy() {
                  try { if (cm != null && cb != null) { cm.bindProcessToNetwork(null); cm.unregisterNetworkCallback(cb); } }
                  catch (Exception ignored) { }
                  super.onDestroy();
              }
          }
          THEPKUB_EOF
          cat > app/src/main/assets/index.html <<'THEPKUB_EOF'
          <!DOCTYPE html>
          <html lang="th"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <meta name="theme-color" content="#05070b"><title>Thepkub</title>
          <style>
          :root{--bg:#05070b;--card:#0c1119;--line:#1b2636;--gold:#d9b46a;--cy:#38e8ff;--red:#ff4b5c;--ok:#3dffa2;--tx:#e8eef7;--mu:#7b8aa0}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
          html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 0%,#0f1826 0%,var(--bg) 60%);color:var(--tx);font-family:system-ui,"Noto Sans Thai",sans-serif;overflow:hidden}
          .page{position:fixed;inset:0;display:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
          .page.on{display:flex}
          /* ---------- connect ---------- */
          #pc{flex-direction:column;align-items:center;justify-content:space-between;padding:18px}
          .logo{letter-spacing:.5em;font-weight:800;font-size:22px;background:linear-gradient(90deg,var(--gold),#fff3d0,var(--gold));-webkit-background-clip:text;color:transparent;margin-top:6px}
          .sub{color:var(--mu);font-size:12px;letter-spacing:.2em;text-align:center}
          .scene{perspective:900px;width:100%;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
          .scene:before{content:"";position:absolute;width:min(80vw,420px);height:90px;bottom:18%;border-radius:50%;background:radial-gradient(closest-side,rgba(56,232,255,.28),transparent);filter:blur(6px)}
          #car{position:relative;width:0;height:0;transform-style:preserve-3d;transform:scale(1.15) rotateX(-18deg) rotateY(-35deg)}
          .bx{position:absolute;transform-style:preserve-3d}
          .f{position:absolute;left:50%;top:50%;backface-visibility:hidden;border:1px solid rgba(255,255,255,.08)}
          .btn{width:min(86vw,340px);padding:16px;border-radius:14px;border:1px solid var(--gold);background:linear-gradient(180deg,#1a1510,#0b0906);color:var(--gold);font-size:17px;font-weight:700;letter-spacing:.3em;text-align:center;box-shadow:0 0 24px rgba(217,180,106,.18)}
          .btn:active{transform:scale(.97)}
          #st{font-size:13px;color:var(--mu);min-height:18px;text-align:center}
          .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;box-shadow:0 0 8px var(--red)}
          .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
          .hint{font-size:12px;color:var(--mu);text-align:center;line-height:1.6}
          .hint b{color:var(--gold)}
          /* ---------- drive ---------- */
          #pd{flex-direction:row;align-items:stretch;justify-content:space-between;padding:14px 22px;gap:14px}
          .col{display:flex;flex-direction:column;align-items:center;justify-content:center;width:23%;min-width:110px}
          .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0}
          .top{display:flex;gap:10px;align-items:center;width:100%;justify-content:space-between}
          .chip{font-size:11px;color:var(--mu);border:1px solid var(--line);border-radius:20px;padding:5px 10px;background:var(--card);letter-spacing:.1em;white-space:nowrap}
          .chip.b{color:var(--gold);border-color:#4a3c20}
          .gauge{position:relative;width:min(34vh,190px);aspect-ratio:1}
          .gauge svg{width:100%;height:100%}
          .gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
          .gv b{font-size:min(10vh,52px);font-weight:800;line-height:1;color:var(--tx)}
          .gv span{font-size:10px;color:var(--mu);letter-spacing:.3em}
          .row{display:flex;gap:8px;width:100%;align-items:center}
          .row label{font-size:10px;color:var(--mu);letter-spacing:.12em;white-space:nowrap;width:46px}
          input[type=range]{touch-action:pan-x;-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:var(--line);outline:none}
          input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(217,180,106,.6)}
          .stop{padding:10px 22px;border-radius:12px;border:1px solid var(--red);color:var(--red);background:rgba(255,75,92,.08);font-weight:800;letter-spacing:.25em;font-size:13px}
          .stop:active{background:var(--red);color:#000}
          /* pads */
          .padv,.padh{position:relative;border-radius:40px;background:linear-gradient(180deg,#0e1520,#080c13);border:1px solid var(--line);box-shadow:inset 0 0 30px rgba(0,0,0,.7)}
          .padv{width:92px;height:min(74vh,300px)}
          .padh{width:min(86%,260px);height:92px}
          .padv:before,.padh:before{content:"";position:absolute;background:var(--line)}
          .padv:before{left:50%;top:14px;bottom:14px;width:2px;transform:translateX(-50%)}
          .padh:before{top:50%;left:14px;right:14px;height:2px;transform:translateY(-50%)}
          .mk{position:absolute;left:50%;top:50%;width:1px;height:1px}
          .knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3d0,var(--gold) 45%,#6d5524);box-shadow:0 6px 18px rgba(0,0,0,.7),0 0 18px rgba(217,180,106,.35)}
          .lbl{font-size:10px;color:var(--mu);letter-spacing:.3em;margin:8px 0 0}
          .land{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--gold);letter-spacing:.2em}
          @media (orientation:portrait){#pd.on ~ .land{display:flex}}
          </style></head><body>

          <!-- CONNECT -->
          <div class="page on" id="pc">
            <div><div class="logo">THEPKUB</div><div class="sub">4WD CONTROL SYSTEM</div></div>
            <div class="scene"><div id="car"></div></div>
            <div style="display:flex;flex-direction:column;gap:12px;align-items:center;width:100%">
              <div id="st"><span class="dot"></span>ยังไม่เชื่อมต่อ</div>
              <div class="btn" id="bc">CONNECT</div>
              <div class="hint">ต่อ Wi-Fi <b>Thepkub</b> รหัส <b>12345678</b><br>(ถ้ามือถือถามว่าไม่มีอินเทอร์เน็ต ให้เลือก "คงการเชื่อมต่อไว้")</div>
            </div>
          </div>

          <!-- DRIVE -->
          <div class="page" id="pd">
            <div class="col">
              <div class="padv" id="pt"><div class="knob" id="kt"></div></div>
              <div class="lbl">THROTTLE</div>
            </div>
            <div class="mid">
              <div class="top">
                <div class="chip b" id="ch"><span class="dot ok" id="dt"></span>LINK</div>
                <div class="chip" id="cp">PING -- ms</div>
                <div class="chip" id="cs">STRAIGHT LOCK</div>
              </div>
              <div class="gauge">
                <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="86" fill="none" stroke="#1b2636" stroke-width="10" stroke-dasharray="405 540" transform="rotate(135 100 100)" stroke-linecap="round"/>
                <circle id="arc" cx="100" cy="100" r="86" fill="none" stroke="url(#g)" stroke-width="10" stroke-dasharray="0 540" transform="rotate(135 100 100)" stroke-linecap="round"/>
                <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#38e8ff"/><stop offset="1" stop-color="#d9b46a"/></linearGradient></defs></svg>
                <div class="gv"><b id="sp">0</b><span id="dir">STOP</span></div>
              </div>
              <div style="width:100%;display:flex;flex-direction:column;gap:6px">
                <div class="row"><label>SPEED</label><input type="range" id="cap" min="20" max="100" value="100"><span class="chip" id="capv" style="width:56px;text-align:center">100%</span></div>
                <div class="row"><label>TRIM</label><input type="range" id="trim" min="-30" max="30" value="0"><span class="chip" id="trimv" style="width:56px;text-align:center">0</span></div>
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <div class="chip" id="bt" style="touch-action:manipulation">TEST MOTORS</div>
                  <div class="stop" id="bs">STOP</div>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="padh" id="ps"><div class="knob" id="ks"></div></div>
              <div class="lbl">STEERING</div>
            </div>
          </div>
          <div class="land"><div style="font-size:34px">⟳</div>หมุนมือถือเป็นแนวนอน</div>

          <script>
          const $=id=>document.getElementById(id);
          /* ---------- 3D car (pure CSS, works offline) ---------- */
          function box(p,w,h,d,x,y,z,col,glow){
            const b=document.createElement('div');b.className='bx';
            b.style.transform=`translate3d(${x}px,${y}px,${z}px)`;
            const F=[[w,h,`translateZ(${d/2}px)`],[w,h,`rotateY(180deg) translateZ(${d/2}px)`],[d,h,`rotateY(90deg) translateZ(${w/2}px)`],[d,h,`rotateY(-90deg) translateZ(${w/2}px)`],[w,d,`rotateX(90deg) translateZ(${h/2}px)`],[w,d,`rotateX(-90deg) translateZ(${h/2}px)`]];
            F.forEach((f,i)=>{const e=document.createElement('div');e.className='f';
              e.style.cssText+=`width:${f[0]}px;height:${f[1]}px;margin:${-f[1]/2}px 0 0 ${-f[0]/2}px;transform:${f[2]};background:${i==4&&glow?glow:col}`;
              if(glow&&i!=4)e.style.boxShadow='0 0 14px '+glow;b.appendChild(e)});
            p.appendChild(b);return b;
          }
          const car=$('car');
          box(car,170,26,80,0,0,0,'linear-gradient(135deg,#1c2430,#0a0d13)');            // chassis
          box(car,170,3,60,0,-15,0,'#0b0e14','#38e8ff');                                 // neon top plate
          box(car,64,22,62,-12,-26,0,'linear-gradient(135deg,#d9b46a,#6d5524)');         // cabin
          box(car,66,3,64,-12,-39,0,'#151b26','#d9b46a');                                // roof
          box(car,6,8,16,86,-4,-24,'#fff','#fff');box(car,6,8,16,86,-4,24,'#fff','#fff'); // headlights
          box(car,6,8,16,-86,-4,-24,'#ff2d46','#ff2d46');box(car,6,8,16,-86,-4,24,'#ff2d46','#ff2d46');
          const wheels=[];
          [[-52,48],[52,48],[-52,-48],[52,-48]].forEach(([x,z])=>{box(car,40,40,20,x,10,z,'linear-gradient(135deg,#222b38,#05070a)');box(car,18,18,22,x,10,z,'#d9b46a')});
          let ry=-35,rx=-18,auto=true,drag=null;
          (function spin(){if(auto){ry+=.35}car.style.transform=`scale(1.15) rotateX(${rx}deg) rotateY(${ry}deg)`;requestAnimationFrame(spin)})();
          const sc=document.querySelector('.scene');
          sc.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,ry,rx];auto=false;sc.setPointerCapture(e.pointerId)});
          sc.addEventListener('pointermove',e=>{if(!drag)return;ry=drag[2]+(e.clientX-drag[0])*.6;rx=Math.max(-60,Math.min(5,drag[3]-(e.clientY-drag[1])*.3))});
          sc.addEventListener('pointerup',()=>{drag=null;setTimeout(()=>auto=true,2500)});

          /* ---------- link ---------- */
          let linked=false,busy=false,ping=0,fails=0;
          function st(ok,t){$('st').innerHTML=`<span class="dot ${ok?'ok':''}"></span>${t}`}
          async function api(path,ms=900){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
            try{const r=await fetch(path,{signal:c.signal,cache:'no-store'});return await r.text()}finally{clearTimeout(t)}}
          async function connect(){st(false,'กำลังเชื่อมต่อ...');
            try{const t0=performance.now();const r=await api('/ping',2000);if(r.startsWith('THEPKUB')){
                const j=r.split(',');setTrim(+j[1]||0,false);linked=true;fails=0;st(true,'เชื่อมต่อสำเร็จ');
                setTimeout(()=>{$('pc').classList.remove('on');$('pd').classList.add('on')},500)}else throw 0}
            catch(e){st(false,'ไม่พบรถ — ตรวจว่าเชื่อม Wi-Fi Thepkub แล้ว')}}
          $('bc').onclick=connect;
          let autoTry=setInterval(()=>{if(!linked&&$('pc').classList.contains('on'))connect()},4000);setTimeout(connect,400);

          /* ---------- pads ---------- */
          let T=0,S=0,cap=100;
          function pad(el,knob,axis,set){
            const r=()=>el.getBoundingClientRect();let id=null;
            const mv=e=>{const b=r(),m=axis=='y'?b.height/2-38:b.width/2-38;
              let v=axis=='y'?-(e.clientY-(b.top+b.height/2))/m:(e.clientX-(b.left+b.width/2))/m;
              v=Math.max(-1,Math.min(1,v));set(v);
              knob.style.transform=axis=='y'?`translateY(${-v*m}px)`:`translateX(${v*m}px)`};
            el.addEventListener('pointerdown',e=>{id=e.pointerId;el.setPointerCapture(id);mv(e)});
            el.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});
            const up=e=>{if(e.pointerId!==id)return;id=null;set(0);knob.style.transition='transform .15s';knob.style.transform='';setTimeout(()=>knob.style.transition='',160)};
            el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
          }
          pad($('pt'),$('kt'),'y',v=>T=Math.abs(v)<.06?0:v);
          pad($('ps'),$('ks'),'x',v=>S=Math.abs(v)<.10?0:v);   // deadzone = ขับตรงสนิท
          $('cap').oninput=e=>{cap=+e.target.value;$('capv').textContent=cap+'%'};
          function setTrim(v,send=true){$('trim').value=v;$('trimv').textContent=v>0?'+'+v:v;if(send)api('/trim?v='+v).catch(()=>{})}
          $('trim').oninput=e=>{const v=+e.target.value;$('trimv').textContent=v>0?'+'+v:v};
          $('trim').onchange=e=>setTrim(+e.target.value);
          $('bs').onclick=()=>{T=0;S=0;api('/d?l=0&r=0').catch(()=>{})};
          $('bt').onclick=()=>{if(confirm('ยกล้อขึ้นก่อน! มอเตอร์จะหมุนทีละตัว'))api('/test',8000).catch(()=>{})};

          /* ---------- send loop (20 Hz) ---------- */
          const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
          setInterval(async()=>{
            if(!linked||busy)return;
            let l=T+S*(Math.abs(T)>.05?.75:1),r=T-S*(Math.abs(T)>.05?.75:1);   // arcade mix
            const m=Math.max(1,Math.abs(l),Math.abs(r));l/=m;r/=m;
            const k=Math.max(Math.abs(T),Math.abs(S))*cap;                      // ความเร็วตาม stick
            l=Math.round(l*k);r=Math.round(r*k);
            const spd=Math.round(Math.max(Math.abs(l),Math.abs(r)));
            $('sp').textContent=spd;$('arc').setAttribute('stroke-dasharray',`${spd*4.05} 540`);
            $('dir').textContent=spd==0?'STOP':(T<-.05?'REVERSE':(S==0?'STRAIGHT':(S<0?'◀ LEFT':'RIGHT ▶')));
            $('cs').style.color=S==0&&T!=0?'#3dffa2':'';
            busy=true;const t0=performance.now();
            try{await api(`/d?l=${l}&r=${r}`,500);ping=Math.round(performance.now()-t0);fails=0;$('cp').textContent='PING '+ping+' ms';$('dt').className='dot ok'}
            catch(e){if(++fails>5){$('dt').className='dot';$('cp').textContent='LINK LOST';}}
            busy=false;
          },50);
          document.addEventListener('contextmenu',e=>e.preventDefault());
          </script></body></html>
          THEPKUB_EOF
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Thepkub-APK
          path: app/build/outputs/apk/debug/*.apk
